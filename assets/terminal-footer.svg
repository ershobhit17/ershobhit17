<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink { animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Base -->
  <rect x="0" y="0" width="880" height="170" rx="10" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="880" height="28" rx="10" fill="#0C101A"/>
  <rect x="0" y="20" width="880" height="8" fill="#0C101A"/>
  <line x1="0" y1="28" x2="880" y2="28" stroke="#1E293B" stroke-width="1"/>

  <circle cx="16" cy="14" r="4" fill="#EF4444" opacity="0.8"/>
  <circle cx="28" cy="14" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="40" cy="14" r="4" fill="#10B981" opacity="0.8"/>
  <text x="56" y="18" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">shobhit@cluster:~/intelligent_systems</text>

  <!-- Terminal Body Content -->
  <g transform="translate(24, 52)">
    <!-- Command Line -->
    <text x="0" y="0" fill="#10B981" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">shobhit@node-01<tspan fill="#64748B">:</tspan><tspan fill="#38BDF8">~/systems</tspan><tspan fill="#F1F5F9">$</tspan> <tspan fill="#F1F5F9">cat /var/log/engineer_intent.log</tspan></text>

    <!-- Output Lines -->
    <text x="0" y="26" fill="#00F0FF" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600">&gt; building intelligent systems...</text>
    <text x="0" y="48" fill="#A78BFA" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600">&gt; one commit at a time.</text>

    <!-- Sub-status / Completion -->
    <text x="0" y="74" fill="#64748B" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">[SYS: EPOCH COMPLETE // LOSS: 0.0014 // READY FOR DEPLOYMENT]</text>

    <!-- Prompt with Cursor -->
    <text x="0" y="98" fill="#10B981" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">shobhit@node-01<tspan fill="#64748B">:</tspan><tspan fill="#38BDF8">~/systems</tspan><tspan fill="#F1F5F9">$</tspan> <tspan fill="#00F0FF" class="cursor-blink">█</tspan></text>
  </g>
</svg>
