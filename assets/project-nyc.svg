<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B14"/>
      <stop offset="60%" stop-color="#0E1220"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="p2Border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="p2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="880" height="230" rx="12" fill="url(#p2Bg)" stroke="url(#p2Border)" stroke-width="1.2"/>

  <!-- Left Content Column -->
  <g transform="translate(32, 28)">
    <!-- Category & Badge -->
    <g transform="translate(0, 0)">
      <rect width="168" height="22" rx="4" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="84" y="15" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MACHINE LEARNING PIPELINE</text>

      <rect x="176" y="0" width="128" height="22" rx="4" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="240" y="15" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODEL SERVING (.PKL)</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      NYC Housing &amp; Rental Predictor
    </text>

    <!-- Problem & Built Statement -->
    <text x="0" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#38BDF8" font-weight="700">Problem:</tspan> Complex urban real estate pricing with non-linear geo-spatial and amenity variance.
    </text>
    <text x="0" y="99" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#A78BFA" font-weight="700">Engineered:</tspan> Complete end-to-end ML pipeline with custom ColumnTransformers, outlier filtering,
    </text>
    <text x="0" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      hyperparameter tuning, serialized model weights, and low-latency interactive inference UI.
    </text>

    <!-- Tech Stack Chips -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="86" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="43" y="16" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Python</text>

      <rect x="94" y="0" width="105" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="146" y="16" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Scikit-learn</text>

      <rect x="207" y="0" width="76" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="245" y="16" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Pandas</text>

      <rect x="291" y="0" width="76" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="329" y="16" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">NumPy</text>

      <rect x="375" y="0" width="86" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="418" y="16" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">FastAPI</text>
    </g>
  </g>

  <!-- Right Visual Preview: Model Metrics & Feature Importance -->
  <g transform="translate(585, 22)">
    <rect width="265" height="186" rx="8" fill="#090E17" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Mini window header -->
    <rect width="265" height="24" rx="8" fill="#0F1523"/>
    <rect y="16" width="265" height="8" fill="#0F1523"/>
    <circle cx="14" cy="12" r="3" fill="#EF4444"/>
    <circle cx="24" cy="12" r="3" fill="#F59E0B"/>
    <circle cx="34" cy="12" r="3" fill="#10B981"/>
    <text x="48" y="16" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">MODEL_PIPELINE.PKL</text>

    <!-- Feature Weights Visual -->
    <g transform="translate(18, 38)">
      <text x="0" y="10" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">FEATURE IMPORTANCE</text>

      <!-- Bar 1 -->
      <text x="0" y="28" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">Location/Geo</text>
      <rect x="90" y="20" width="138" height="8" rx="3" fill="#1E293B"/>
      <rect x="90" y="20" width="124" height="8" rx="3" fill="#38BDF8"/>

      <!-- Bar 2 -->
      <text x="0" y="48" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">Room Type</text>
      <rect x="90" y="40" width="138" height="8" rx="3" fill="#1E293B"/>
      <rect x="90" y="40" width="102" height="8" rx="3" fill="#818CF8"/>

      <!-- Bar 3 -->
      <text x="0" y="68" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">Min Nights</text>
      <rect x="90" y="60" width="138" height="8" rx="3" fill="#1E293B"/>
      <rect x="90" y="60" width="68" height="8" rx="3" fill="#A78BFA"/>

      <!-- Bar 4 -->
      <text x="0" y="88" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">Review Score</text>
      <rect x="90" y="80" width="138" height="8" rx="3" fill="#1E293B"/>
      <rect x="90" y="80" width="54" height="8" rx="3" fill="#34D399"/>
    </g>

    <!-- Prediction Outcome Box -->
    <g transform="translate(18, 142)">
      <rect width="228" height="30" rx="4" fill="#0C1524" stroke="#38BDF8" stroke-width="0.8"/>
      <circle cx="14" cy="15" r="4" fill="#10B981" filter="url(#p2Glow)"/>
      <text x="26" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">PRED: <tspan fill="#38BDF8">Entire Home/Apt</tspan> (94.2%)</text>
    </g>
  </g>
</svg>
