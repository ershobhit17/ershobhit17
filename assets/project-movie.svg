<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0813"/>
      <stop offset="60%" stop-color="#120D20"/>
      <stop offset="100%" stop-color="#06050B"/>
    </linearGradient>
    <linearGradient id="p3Border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="880" height="230" rx="12" fill="url(#p3Bg)" stroke="url(#p3Border)" stroke-width="1.2"/>

  <!-- Left Content Column -->
  <g transform="translate(32, 28)">
    <!-- Category & Badge -->
    <g transform="translate(0, 0)">
      <rect width="176" height="22" rx="4" fill="#F43F5E" fill-opacity="0.14" stroke="#F43F5E" stroke-width="0.8"/>
      <text x="88" y="15" fill="#FB7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">RECOMMENDER SYSTEMS</text>

      <rect x="184" y="0" width="124" height="22" rx="4" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="246" y="15" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">CLOUD DEPLOYED</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      Vector-Driven Movie Recommender
    </text>

    <!-- Problem & Built Statement -->
    <text x="0" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#FB7185" font-weight="700">Problem:</tspan> Surface-level genre filtering fails to capture rich semantic narrative connections.
    </text>
    <text x="0" y="99" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#A78BFA" font-weight="700">Engineered:</tspan> High-dimensional TF-IDF feature space + Cosine similarity matrix model capable of
    </text>
    <text x="0" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      instant Top-K vector queries, deployed with production REST API endpoints on Render.
    </text>

    <!-- Tech Stack Chips -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="86" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="43" y="16" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Python</text>

      <rect x="94" y="0" width="105" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="146" y="16" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Scikit-learn</text>

      <rect x="207" y="0" width="76" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="245" y="16" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Pandas</text>

      <rect x="291" y="0" width="128" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="355" y="16" fill="#FB7185" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Cosine Similarity</text>

      <rect x="427" y="0" width="76" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="465" y="16" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Render</text>
    </g>
  </g>

  <!-- Right Visual Preview: Embedding Space & Similarity Cluster -->
  <g transform="translate(585, 22)">
    <rect width="265" height="186" rx="8" fill="#0C0A15" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Mini window header -->
    <rect width="265" height="24" rx="8" fill="#130F20"/>
    <rect y="16" width="265" height="8" fill="#130F20"/>
    <circle cx="14" cy="12" r="3" fill="#EF4444"/>
    <circle cx="24" cy="12" r="3" fill="#F59E0B"/>
    <circle cx="34" cy="12" r="3" fill="#10B981"/>
    <text x="48" y="16" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">COSINE_SIMILARITY_SPACE</text>

    <!-- Vector Match Cluster Visual -->
    <g transform="translate(20, 38)">
      <!-- Query Vector -->
      <circle cx="50" cy="50" r="10" fill="#2D0B20" stroke="#FB7185" stroke-width="2"/>
      <circle cx="50" cy="50" r="4" fill="#FB7185" filter="url(#p3Glow)"/>
      <text x="66" y="54" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Inception (Query)</text>

      <!-- Ray lines to neighbors -->
      <line x1="50" y1="50" x2="175" y2="28" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="2 2"/>
      <line x1="50" y1="50" x2="185" y2="72" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="2 2"/>
      <line x1="50" y1="50" x2="160" y2="105" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="2 2"/>

      <!-- Neighbor 1 -->
      <circle cx="175" cy="28" r="6" fill="#1A1033" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="187" y="32" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Interstellar [0.96]</text>

      <!-- Neighbor 2 -->
      <circle cx="185" cy="72" r="6" fill="#1A1033" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="197" y="76" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">The Matrix [0.91]</text>

      <!-- Neighbor 3 -->
      <circle cx="160" cy="105" r="6" fill="#1A1033" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="172" y="109" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Shutter Island [0.88]</text>
    </g>

    <!-- Query Stats -->
    <text x="20" y="166" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5">
      TOP_K: <tspan fill="#FB7185">10</tspan> | LATENCY: <tspan fill="#00F0FF">18ms</tspan> | MEM_MAP: OK
    </text>
  </g>
</svg>
