<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D14"/>
      <stop offset="60%" stop-color="#0B1522"/>
      <stop offset="100%" stop-color="#05090F"/>
    </linearGradient>
    <linearGradient id="p4Border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="p4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="880" height="230" rx="12" fill="url(#p4Bg)" stroke="url(#p4Border)" stroke-width="1.2"/>

  <!-- Left Content Column -->
  <g transform="translate(32, 28)">
    <!-- Category & Badge -->
    <g transform="translate(0, 0)">
      <rect width="156" height="22" rx="4" fill="#00F0FF" fill-opacity="0.14" stroke="#00F0FF" stroke-width="0.8"/>
      <text x="78" y="15" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">COMPUTER VISION &amp; HCI</text>

      <rect x="164" y="0" width="138" height="22" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="233" y="15" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">REAL-TIME WEBSOCKET</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      Instagram Air Gesture Vision Control
    </text>

    <!-- Problem & Built Statement -->
    <text x="0" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#00F0FF" font-weight="700">Problem:</tspan> Touch/hardware constraints prevent hands-free browser control and interactive media browsing.
    </text>
    <text x="0" y="99" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#38BDF8" font-weight="700">Engineered:</tspan> MediaPipe 21-point hand landmark pipeline running in-browser with WebSocket relay server,
    </text>
    <text x="0" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      translating air swipes, pinches, and hover gestures into instantaneous UI navigation events.
    </text>

    <!-- Tech Stack Chips -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="94" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="47" y="16" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

      <rect x="102" y="0" width="92" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="148" y="16" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">MediaPipe</text>

      <rect x="202" y="0" width="96" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="250" y="16" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">WebSockets</text>

      <rect x="306" y="0" width="138" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="375" y="16" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Chrome Extension</text>

      <rect x="452" y="0" width="76" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="490" y="16" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Node.js</text>
    </g>
  </g>

  <!-- Right Visual Preview: 21-Point Hand Landmark Mesh & Gesture Telemetry -->
  <g transform="translate(585, 22)">
    <rect width="265" height="186" rx="8" fill="#080E17" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Mini window header -->
    <rect width="265" height="24" rx="8" fill="#0E1624"/>
    <rect y="16" width="265" height="8" fill="#0E1624"/>
    <circle cx="14" cy="12" r="3" fill="#EF4444"/>
    <circle cx="24" cy="12" r="3" fill="#F59E0B"/>
    <circle cx="34" cy="12" r="3" fill="#10B981"/>
    <text x="48" y="16" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">HAND_TRACKING_21_POINTS</text>

    <!-- Hand Mesh Visualization -->
    <g transform="translate(45, 42)">
      <!-- Palm center -->
      <circle cx="75" cy="80" r="5" fill="#0C2538" stroke="#00F0FF" stroke-width="1.5"/>
      
      <!-- Wrist -->
      <circle cx="75" cy="105" r="4" fill="#00F0FF"/>
      <line x1="75" y1="105" x2="75" y2="80" stroke="#00F0FF" stroke-width="1.2"/>

      <!-- Thumb -->
      <line x1="75" y1="80" x2="40" y2="65" stroke="#38BDF8" stroke-width="1.2"/>
      <line x1="40" y1="65" x2="25" y2="45" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="40" cy="65" r="3" fill="#38BDF8"/>
      <circle cx="25" cy="45" r="4" fill="#00F0FF" filter="url(#p4Glow)"/>

      <!-- Index -->
      <line x1="75" y1="80" x2="55" y2="40" stroke="#00F0FF" stroke-width="1.2"/>
      <line x1="55" y1="40" x2="48" y2="15" stroke="#00F0FF" stroke-width="1.2"/>
      <circle cx="55" cy="40" r="3" fill="#00F0FF"/>
      <circle cx="48" cy="15" r="4.5" fill="#FFFFFF" filter="url(#p4Glow)"/>

      <!-- Middle -->
      <line x1="75" y1="80" x2="75" y2="35" stroke="#00F0FF" stroke-width="1.2"/>
      <line x1="75" y1="35" x2="75" y2="10" stroke="#00F0FF" stroke-width="1.2"/>
      <circle cx="75" cy="35" r="3" fill="#00F0FF"/>
      <circle cx="75" cy="10" r="4" fill="#00F0FF" filter="url(#p4Glow)"/>

      <!-- Ring -->
      <line x1="75" y1="80" x2="95" y2="40" stroke="#38BDF8" stroke-width="1.2"/>
      <line x1="95" y1="40" x2="102" y2="20" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="95" cy="40" r="3" fill="#38BDF8"/>
      <circle cx="102" cy="20" r="3.5" fill="#38BDF8"/>

      <!-- Pinky -->
      <line x1="75" y1="80" x2="115" y2="52" stroke="#38BDF8" stroke-width="1.2"/>
      <line x1="115" y1="52" x2="125" y2="38" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="115" cy="52" r="3" fill="#38BDF8"/>
      <circle cx="125" cy="38" r="3" fill="#38BDF8"/>

      <!-- Gesture Pill Tag -->
      <rect x="110" y="80" width="88" height="22" rx="4" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="0.8"/>
      <text x="154" y="94" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">SWIPE_UP_RECOGNIZED</text>
    </g>

    <!-- Telemetry -->
    <text x="20" y="168" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5">
      FPS: <tspan fill="#10B981">60.0</tspan> | RELAY: <tspan fill="#00F0FF">CONNECTED</tspan> | DELAY: 9ms
    </text>
  </g>
</svg>
