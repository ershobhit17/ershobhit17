<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <linearGradient id="buildBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B13"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="buildCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C121E"/>
      <stop offset="100%" stop-color="#070A11"/>
    </linearGradient>
    <style>
      @keyframes blinkPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .beacon-active { animation: blinkPulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Base Container -->
  <rect x="0" y="0" width="920" height="300" rx="12" fill="url(#buildBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Status bar -->
  <text x="30" y="28" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">
    ACTIVE_WORKBENCH // 4 CONCURRENT TRACKS
  </text>
  <text x="740" y="28" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
    ● 4 WORKSPACES RUNNING
  </text>
  <line x1="30" y1="38" x2="890" y2="38" stroke="#162032" stroke-width="1"/>

  <!-- 2x2 Grid -->

  <!-- Card 1: NutriSafe AI (Top-Left) -->
  <g transform="translate(30, 52)">
    <rect width="420" height="105" rx="8" fill="url(#buildCardGrad)" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Status Tag -->
    <circle cx="20" cy="18" r="4" fill="#10B981" class="beacon-active"/>
    <text x="32" y="22" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TRACK 01 // ACTIVE DEV</text>
    
    <text x="20" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">NutriSafe AI</text>
    <text x="20" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">
      Multimodal food safety intelligence with real-time OCR &amp; additive toxicity risk scoring.
    </text>
    <text x="20" y="88" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
      FastAPI • TypeScript • React • PyTorch
    </text>
  </g>

  <!-- Card 2: NYC Predictor (Top-Right) -->
  <g transform="translate(470, 52)">
    <rect width="420" height="105" rx="8" fill="url(#buildCardGrad)" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Status Tag -->
    <circle cx="20" cy="18" r="4" fill="#38BDF8" class="beacon-active"/>
    <text x="32" y="22" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TRACK 02 // BENCHMARKING</text>
    
    <text x="20" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">NYC House Type &amp; Rental Predictor</text>
    <text x="20" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">
      Serialized ML pipeline for urban accommodation classification with custom transformers.
    </text>
    <text x="20" y="88" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
      Python • Scikit-learn • Pandas • FastAPI
    </text>
  </g>

  <!-- Card 3: Air Gesture (Bottom-Left) -->
  <g transform="translate(30, 172)">
    <rect width="420" height="105" rx="8" fill="url(#buildCardGrad)" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Status Tag -->
    <circle cx="20" cy="18" r="4" fill="#00F0FF" class="beacon-active"/>
    <text x="32" y="22" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TRACK 03 // VISION &amp; HCI</text>
    
    <text x="20" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">Instagram Air Gesture Vision Control</text>
    <text x="20" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">
      Real-time 21-point hand landmark tracking driving touchless browser interaction.
    </text>
    <text x="20" y="88" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
      TypeScript • MediaPipe • WebSockets • OpenCV
    </text>
  </g>

  <!-- Card 4: Generative Writing / Email Generator (Bottom-Right) -->
  <g transform="translate(470, 172)">
    <rect width="420" height="105" rx="8" fill="url(#buildCardGrad)" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- Status Tag -->
    <circle cx="20" cy="18" r="4" fill="#8B5CF6" class="beacon-active"/>
    <text x="32" y="22" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TRACK 04 // NLP &amp; LLMS</text>
    
    <text x="20" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">AI Context-Aware Email Generator</text>
    <text x="20" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">
      NLP intelligence tool synthesizing tone-adaptive professional correspondence from intents.
    </text>
    <text x="20" y="88" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
      Python • NLP • LLM Prompting • Flask
    </text>
  </g>
</svg>
