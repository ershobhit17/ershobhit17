<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070912"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="25%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="lpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Panel Base -->
  <rect x="0" y="0" width="920" height="180" rx="12" fill="url(#learnBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top bar info -->
  <text x="30" y="28" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">
    PROGRESSION_MAP // RECURSIVE ARCHITECTURE
  </text>
  <text x="730" y="28" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">
    DIRECTION: SCALED AI
  </text>

  <!-- Continuous Connecting Pipeline Tube -->
  <line x1="75" y1="80" x2="845" y2="80" stroke="#162032" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="80" x2="680" y2="80" stroke="url(#pipelineGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#lpGlow)"/>

  <!-- Node 1: Machine Learning -->
  <g transform="translate(75, 80)">
    <circle cx="0" cy="0" r="16" fill="#091817" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#10B981"/>
    <text x="0" y="-26" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">01 // ML</text>
    <text x="0" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Machine Learning</text>
    <text x="0" y="47" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Scikit, XGB, Stats</text>
    <rect x="-38" y="58" width="76" height="16" rx="3" fill="#10B981" fill-opacity="0.15"/>
    <text x="0" y="69" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">FOUNDATION</text>
  </g>

  <!-- Node 2: Deep Learning -->
  <g transform="translate(265, 80)">
    <circle cx="0" cy="0" r="16" fill="#061A28" stroke="#00F0FF" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#00F0FF"/>
    <text x="0" y="-26" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">02 // DL</text>
    <text x="0" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Deep Learning</text>
    <text x="0" y="47" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">PyTorch, CNN, Loss</text>
    <rect x="-38" y="58" width="76" height="16" rx="3" fill="#00F0FF" fill-opacity="0.15"/>
    <text x="0" y="69" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">CORE STACK</text>
  </g>

  <!-- Node 3: NLP -->
  <g transform="translate(455, 80)">
    <circle cx="0" cy="0" r="16" fill="#0C142E" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
    <text x="0" y="-26" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">03 // NLP</text>
    <text x="0" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">NLP &amp; Vectors</text>
    <text x="0" y="47" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Embeddings, TF-IDF</text>
    <rect x="-42" y="58" width="84" height="16" rx="3" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="0" y="69" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">EXPERIMENTING</text>
  </g>

  <!-- Node 4: Generative AI -->
  <g transform="translate(645, 80)">
    <circle cx="0" cy="0" r="16" fill="#1C1033" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#A78BFA"/>
    <text x="0" y="-26" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">04 // GENAI</text>
    <text x="0" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Generative AI</text>
    <text x="0" y="47" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">LLMs, Prompts, RAG</text>
    <rect x="-38" y="58" width="76" height="16" rx="3" fill="#8B5CF6" fill-opacity="0.15"/>
    <text x="0" y="69" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">BUILDING</text>
  </g>

  <!-- Node 5: AI Systems -->
  <g transform="translate(835, 80)">
    <circle cx="0" cy="0" r="16" fill="#240D1D" stroke="#EC4899" stroke-width="2.5" stroke-dasharray="3 2"/>
    <circle cx="0" cy="0" r="5" fill="#F472B6"/>
    <text x="0" y="-26" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">05 // SYSTEMS</text>
    <text x="0" y="32" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Production AI</text>
    <text x="0" y="47" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">MLOps, FastAPI, Scale</text>
    <rect x="-42" y="58" width="84" height="16" rx="3" fill="#EC4899" fill-opacity="0.15"/>
    <text x="0" y="69" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">TARGET GOAL</text>
  </g>
</svg>
