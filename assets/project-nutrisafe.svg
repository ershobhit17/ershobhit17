<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C12"/>
      <stop offset="60%" stop-color="#0A121A"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="p1Border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="880" height="230" rx="12" fill="url(#p1Bg)" stroke="url(#p1Border)" stroke-width="1.2"/>

  <!-- Left Content Column -->
  <g transform="translate(32, 28)">
    <!-- Category & Badge -->
    <g transform="translate(0, 0)">
      <rect width="138" height="22" rx="4" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-width="0.8"/>
      <text x="69" y="15" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">AI HEALTH &amp; SAFETY</text>

      <rect x="146" y="0" width="112" height="22" rx="4" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="0.8"/>
      <text x="202" y="15" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">FULLSTACK AI</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      NutriSafe AI — Multimodal Food Intelligence
    </text>

    <!-- Problem & Built Statement -->
    <text x="0" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#34D399" font-weight="700">Problem:</tspan> Hidden chemical allergens and confusing ingredient labeling in packaged consumer foods.
    </text>
    <text x="0" y="99" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#00F0FF" font-weight="700">Engineered:</tspan> Computer vision OCR pipeline + NLP scoring engine that analyzes food labels in &lt;300ms,
    </text>
    <text x="0" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
      flagging ultra-processed additives and generating safe dietary substitutes.
    </text>

    <!-- Tech Stack Chips -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="86" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="43" y="16" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">FastAPI</text>

      <rect x="94" y="0" width="94" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="141" y="16" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

      <rect x="196" y="0" width="70" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="231" y="16" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">React</text>

      <rect x="274" y="0" width="76" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="312" y="16" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">PyTorch</text>

      <rect x="358" y="0" width="86" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="401" y="16" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">NLP / CV</text>
    </g>
  </g>

  <!-- Right Visual Preview: Interactive Scanner Telemetry Window -->
  <g transform="translate(585, 22)">
    <rect width="265" height="186" rx="8" fill="#080E14" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Header of mini window -->
    <rect width="265" height="24" rx="8" fill="#0D1620"/>
    <rect y="16" width="265" height="8" fill="#0D1620"/>
    <circle cx="14" cy="12" r="3" fill="#EF4444"/>
    <circle cx="24" cy="12" r="3" fill="#F59E0B"/>
    <circle cx="34" cy="12" r="3" fill="#10B981"/>
    <text x="48" y="16" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">INFERENCE_MONITOR</text>

    <!-- Scan Reticle -->
    <g transform="translate(20, 36)">
      <!-- Bounding Box -->
      <rect x="0" y="0" width="225" height="70" rx="4" fill="#0C1924" stroke="#10B981" stroke-width="1" stroke-dasharray="4 2"/>
      <path d="M 0 10 L 0 0 L 10 0" stroke="#00F0FF" stroke-width="2" fill="none"/>
      <path d="M 215 0 L 225 0 L 225 10" stroke="#00F0FF" stroke-width="2" fill="none"/>
      <path d="M 0 60 L 0 70 L 10 70" stroke="#00F0FF" stroke-width="2" fill="none"/>
      <path d="M 215 70 L 225 70 L 225 60" stroke="#00F0FF" stroke-width="2" fill="none"/>

      <text x="14" y="24" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">INPUT: Tartrazine (E102)</text>
      <text x="14" y="42" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">▲ HAZARD: Artificial Dye [High]</text>
      <text x="14" y="58" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">✓ Recommendation Generated</text>
    </g>

    <!-- Score Bar -->
    <g transform="translate(20, 120)">
      <text x="0" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5">SAFETY INDEX</text>
      <text x="175" y="12" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">89.4 / 100</text>
      
      <!-- Progress Bar Track -->
      <rect x="0" y="18" width="225" height="8" rx="4" fill="#1E293B"/>
      <!-- Progress Bar Fill -->
      <rect x="0" y="18" width="201" height="8" rx="4" fill="#10B981" filter="url(#p1Glow)"/>
    </g>

    <!-- Latency Readout -->
    <text x="20" y="165" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5">
      INFERENCE_TIME: <tspan fill="#00F0FF">248ms</tspan> | CLOUD: OK
    </text>
  </g>
</svg>
