<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Thin base line -->
  <line x1="40" y1="12" x2="860" y2="12" stroke="url(#divGrad)" stroke-width="1.2"/>
  <!-- Center Accent Node -->
  <g transform="translate(450, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#06070B" stroke="#00F0FF" stroke-width="1.5" filter="url(#divGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#8B5CF6"/>
    <!-- Small flanking ticks -->
    <circle cx="-16" cy="0" r="1.5" fill="#00F0FF" opacity="0.6"/>
    <circle cx="16" cy="0" r="1.5" fill="#8B5CF6" opacity="0.6"/>
  </g>
</svg>
