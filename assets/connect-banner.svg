<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="connBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="connGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="920" height="120" rx="10" fill="url(#connBg)" stroke="url(#connBorder)" stroke-width="1.2"/>

  <!-- Left Cyber Beacon -->
  <g transform="translate(35, 30)">
    <circle cx="28" cy="30" r="18" fill="#0C1D2A" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="6" fill="#00F0FF" filter="url(#connGlow)"/>
    
    <text x="65" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">
      INITIATE DIRECT TRANSMISSION
    </text>
    <text x="65" y="46" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
      Open for AI/ML engineering roles, high-impact research, and technical collaboration.
    </text>
  </g>

  <!-- Right Signal Telemetry -->
  <g transform="translate(710, 42)">
    <rect width="175" height="36" rx="6" fill="#0E1624" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#10B981"/>
    <text x="32" y="22" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STATUS: AVAILABLE</text>
  </g>
</svg>
