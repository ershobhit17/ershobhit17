      <rect x="0" y="0" width="98" height="30" rx="6" fill="#0E1726" stroke="#EE4C2C" stroke-width="0.8"/>
      <circle cx="15" cy="15" r="4.5" fill="#EE4C2C"/>
      <text x="28" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PyTorch</text>

