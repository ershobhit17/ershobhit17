      <circle cx="15" cy="15" r="4.5" fill="#10B981"/>
      <text x="28" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">FastAPI</text>

      <!-- REST APIs -->
      <rect x="105" y="0" width="105" height="30" rx="6" fill="#0E1726" stroke="#38BDF8" stroke-width="0.8"/>
      <circle cx="119" cy="15" r="4.5" fill="#38BDF8"/>
      <text x="131" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">REST APIs</text>
