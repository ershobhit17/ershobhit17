      <circle cx="15" cy="16" r="4.5" fill="#F05032"/>
      <text x="28" y="20" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Git</text>

      <!-- GitHub -->
      <rect x="85" y="0" width="95" height="32" rx="6" fill="#0E1726" stroke="#94A3B8" stroke-width="0.8"/>
      <circle cx="100" cy="16" r="4.5" fill="#FFFFFF"/>
      <text x="112" y="20" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">GitHub</text>

      <!-- Docker -->
      <rect x="190" y="0" width="95" height="32" rx="6" fill="#0E1726" stroke="#2496ED" stroke-width="0.8"/>
      <circle cx="205" cy="16" r="4.5" fill="#2496ED"/>
      <text x="218" y="20" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Docker</text>

      <!-- VS Code -->
      <rect x="295" y="0" width="105" height="32" rx="6" fill="#0E1726" stroke="#007ACC" stroke-width="0.8"/>
      <circle cx="310" cy="16" r="4.5" fill="#007ACC"/>
      <text x="323" y="20" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">VS Code</text>

      <!-- Jupyter -->
      <rect x="410" y="0" width="105" height="32" rx="6" fill="#0E1726" stroke="#F37626" stroke-width="0.8"/>
      <circle cx="425" cy="16" r="4.5" fill="#F37626"/>
      <text x="438" y="20" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Jupyter</text>

      <!-- Postman -->
      <rect x="525" y="0" width="105" height="32" rx="6" fill="#0E1726" stroke="#FF6C37" stroke-width="0.8"/>
      <circle cx="540" cy="16" r="4.5" fill="#FF6C37"/>
      <text x="553" y="20" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Postman</text>
    </g>
  </g>
</svg>
