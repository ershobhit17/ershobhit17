  <g transform="translate(620, 195)">
    <rect width="270" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" fill="#EC4899" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">06 // DEPLOYMENT &amp; CLOUD</text>

    <!-- Badges Row -->
    <g transform="translate(16, 38)">
      <!-- Render -->
      <rect x="0" y="0" width="90" height="30" rx="6" fill="#0E1726" stroke="#46E3B7" stroke-width="0.8"/>
      <circle cx="15" cy="15" r="4.5" fill="#46E3B7"/>
      <text x="28" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Render</text>

      <!-- Linux / CLI -->
      <rect x="100" y="0" width="115" height="30" rx="6" fill="#0E1726" stroke="#F43F5E" stroke-width="0.8"/>
      <circle cx="114" cy="15" r="4.5" fill="#F43F5E"/>
      <text x="126" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Linux / Bash</text>
    </g>
  </g>

  <!-- 7. TOOLS & ECOSYSTEM (Wide Full-Row) -->
  <g transform="translate(30, 330)">
    <rect width="860" height="100" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="24" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">07 // DEVELOPER TOOLS &amp; WORKFLOWS</text>

    <!-- Badges Row -->
    <g transform="translate(20, 42)">
      <!-- Git -->
