<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B13"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C121D"/>
      <stop offset="100%" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <filter id="stackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="0" y="0" width="920" height="460" rx="12" fill="url(#stackBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Status bar -->
  <text x="30" y="32" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">
    SYSTEM_MODULES // VERIFIED TECH STACK
  </text>
  <text x="750" y="32" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    TOTAL STACK: 18 TOOLS
  </text>
  <line x1="30" y1="44" x2="890" y2="44" stroke="#162032" stroke-width="1"/>

  <!-- GRID OF CATEGORIES -->

  <!-- 1. LANGUAGES -->
  <g transform="translate(30, 60)">
    <rect width="270" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">01 // LANGUAGES</text>
    
    <!-- Badges Row -->
    <g transform="translate(16, 38)">
      <!-- Python -->
      <rect x="0" y="0" width="105" height="30" rx="6" fill="#0E1726" stroke="#38BDF8" stroke-width="0.8"/>
      <circle cx="15" cy="15" r="4.5" fill="#38BDF8"/>
      <text x="28" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Python</text>

      <!-- SQL -->
      <rect x="115" y="0" width="75" height="30" rx="6" fill="#0E1726" stroke="#00F0FF" stroke-width="0.8"/>
      <circle cx="130" cy="15" r="4.5" fill="#00F0FF"/>
      <text x="142" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SQL</text>
      
      <!-- C/C++ -->
      <rect x="0" y="38" width="95" height="30" rx="6" fill="#0E1726" stroke="#818CF8" stroke-width="0.8"/>
      <circle cx="15" cy="53" r="4.5" fill="#818CF8"/>
      <text x="28" y="57" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">C / C++</text>
    </g>
  </g>

  <!-- 2. DATA & SCIENTIFIC -->
  <g transform="translate(325, 60)">
    <rect width="270" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">02 // DATA COMPUTING</text>

    <!-- Badges Row -->
    <g transform="translate(16, 38)">
      <!-- NumPy -->
      <rect x="0" y="0" width="85" height="30" rx="6" fill="#0E1726" stroke="#00F0FF" stroke-width="0.8"/>
      <circle cx="14" cy="15" r="4.5" fill="#00F0FF"/>
      <text x="26" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">NumPy</text>

      <!-- Pandas -->
      <rect x="95" y="0" width="90" height="30" rx="6" fill="#0E1726" stroke="#38BDF8" stroke-width="0.8"/>
      <circle cx="109" cy="15" r="4.5" fill="#38BDF8"/>
      <text x="121" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Pandas</text>

      <!-- Matplotlib -->
      <rect x="0" y="38" width="115" height="30" rx="6" fill="#0E1726" stroke="#818CF8" stroke-width="0.8"/>
      <circle cx="15" cy="53" r="4.5" fill="#818CF8"/>
      <text x="28" y="57" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Matplotlib</text>
    </g>
  </g>

  <!-- 3. MACHINE LEARNING -->
  <g transform="translate(620, 60)">
    <rect width="270" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">03 // MACHINE LEARNING</text>

    <!-- Badges Row -->
    <g transform="translate(16, 38)">
      <!-- Scikit-learn -->
      <rect x="0" y="0" width="128" height="30" rx="6" fill="#0E1726" stroke="#F59E0B" stroke-width="0.8"/>
      <circle cx="15" cy="15" r="4.5" fill="#F59E0B"/>
      <text x="28" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Scikit-learn</text>

      <!-- XGBoost -->
      <rect x="138" y="0" width="95" height="30" rx="6" fill="#0E1726" stroke="#00F0FF" stroke-width="0.8"/>
      <circle cx="152" cy="15" r="4.5" fill="#00F0FF"/>
      <text x="164" y="19" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">XGBoost</text>
    </g>
  </g>

  <!-- 4. DEEP LEARNING -->
  <g transform="translate(30, 195)">
    <rect width="270" height="115" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">04 // DEEP LEARNING</text>

    <!-- Badges Row -->
    <g transform="translate(16, 38)">
