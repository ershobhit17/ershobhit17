<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B13"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Panel Base -->
  <rect x="0" y="0" width="920" height="220" rx="10" fill="url(#aboutBg)" stroke="url(#borderGlow)" stroke-width="1.2"/>

  <!-- Top Terminal Header -->
  <rect x="0" y="0" width="920" height="32" rx="10" fill="#0D111A"/>
  <rect x="0" y="24" width="920" height="8" fill="#0D111A"/>
  <line x1="0" y1="32" x2="920" y2="32" stroke="#1E293B" stroke-width="1"/>

  <circle cx="20" cy="16" r="4" fill="#EF4444" opacity="0.8"/>
  <circle cx="34" cy="16" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="48" cy="16" r="4" fill="#10B981" opacity="0.8"/>

  <text x="68" y="20" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">SPEC // ARCHITECTURE &amp; RESEARCH PROFILE</text>
  <text x="820" y="20" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">STATUS: ACTIVE</text>

  <!-- Three Architecture Pillars -->
  <!-- Column 1 -->
  <g transform="translate(30, 52)">
    <rect width="265" height="145" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <!-- Pillar header -->
    <rect x="12" y="14" width="34" height="18" rx="3" fill="#00F0FF" fill-opacity="0.12"/>
    <text x="29" y="27" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">01</text>
    <text x="56" y="27" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CORE FOUNDATIONS</text>

    <text x="14" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • B.Tech in Engineering
    </text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • Python &amp; Algorithmic Thinking
    </text>
    <text x="14" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • Linear Algebra, Stats &amp; Calc
    </text>
    <text x="14" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • Data Pipelines &amp; ETL Workflows
    </text>
  </g>

  <!-- Column 2 -->
  <g transform="translate(325, 52)">
    <rect width="265" height="145" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <!-- Pillar header -->
    <rect x="12" y="14" width="34" height="18" rx="3" fill="#8B5CF6" fill-opacity="0.15"/>
    <text x="29" y="27" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">02</text>
    <text x="56" y="27" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">INTELLIGENCE STACK</text>

    <text x="14" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • Scikit-learn &amp; Gradient Boosting
    </text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • PyTorch &amp; Deep Neural Nets
    </text>
    <text x="14" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • Computer Vision (MediaPipe, CV)
    </text>
    <text x="14" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • NLP &amp; Generative AI Pipelines
    </text>
  </g>

  <!-- Column 3 -->
  <g transform="translate(620, 52)">
    <rect width="270" height="145" rx="8" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <!-- Pillar header -->
    <rect x="12" y="14" width="34" height="18" rx="3" fill="#10B981" fill-opacity="0.12"/>
    <text x="29" y="27" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">03</text>
    <text x="56" y="27" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PRODUCTION SYSTEMS</text>

    <text x="14" y="58" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • High-Throughput FastAPI REST APIs
    </text>
    <text x="14" y="78" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • Model Serialization &amp; Serving
    </text>
    <text x="14" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • Docker &amp; Cloud Deployment
    </text>
    <text x="14" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">
      • AI Content &amp; Dev Education
    </text>
  </g>
</svg>
